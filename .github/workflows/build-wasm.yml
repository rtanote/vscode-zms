name: Build z-music.js WASM

# 手動 or 週次で走らせて WASM 再現ビルドを検証。
# 成果物 (zmusic.js / zmusic.wasm) は artifact としてダウンロード可能にし、
# 実際のコミット対象は開発者ローカルで `scripts/build-zmusic.sh` を回したものにする
# 実際のコミット対象は開発者ローカルで手動ビルドしたものにする。

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # 毎週月曜 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build via scripts/build-zmusic.sh
        run: |
          chmod +x scripts/build-zmusic.sh
          scripts/build-zmusic.sh

      - name: Diff against committed artifacts
        run: |
          if [[ -f media/player/zmusic.wasm ]]; then
            git diff --stat media/player/ || true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: zmusic-wasm-${{ github.sha }}
          path: |
            media/player/zmusic.js
            media/player/zmusic.wasm
